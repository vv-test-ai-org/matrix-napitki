name: Обновить матрицу

# Кнопка «Обновить данные» на странице ведёт сюда (Run workflow). Сборка идёт на self-hosted runner внутри контура
# (см. runner/setup.sh): только оттуда доступны Superset и 1С, и только там лежат креды (.env) и данные (data/).
on:
  workflow_dispatch:
    inputs:
      fetch:
        description: 'Обновить данные из Superset и Трекера (иначе пересобрать из текущих data/)'
        type: boolean
        default: true
  schedule:
    - cron: '0 4 * * 1'   # понедельник 07:00 МСК

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Сборка и публикация из локальной копии проекта
        shell: bash
        run: |
          set -euo pipefail
          : "${MATRIX_HOME:?переменная MATRIX_HOME не задана в .env раннера (runner/setup.sh)}"
          cd "$MATRIX_HOME"
          git pull --ff-only
          if [ "${{ github.event.inputs.fetch }}" = "false" ]; then ARGS=--no-fetch; else ARGS=; fi
          "${MATRIX_PYTHON:-python3}" publish.py $ARGS
